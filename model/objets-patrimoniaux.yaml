version: "1.1.0"
project: "ARIANE"
purpose: >-
  Référentiel machine-readable des objets patrimoniaux autorisés, de leurs parents
  possibles et des règles structurantes à appliquer lors de la captation.

principles:
  - "PROGRAMME est la racine de contexte du référentiel ARIANE."
  - "À partir de FONCIER, la hiérarchie décrit d'abord la réalité physique du patrimoine."
  - "Chaque objet possède au maximum un parent principal, sauf l'objet racine."
  - "Le parent physique le plus précis démontrable doit être utilisé à partir du niveau FONCIER."
  - "Les niveaux RDC, R+1, SS-1, etc. sont des localisations et non des objets."
  - "Les relations d'affectation, d'usage, de desserte ou d'implantation cadastrale sont complémentaires."
  - "Ne jamais inventer un type patrimonial absent de ce référentiel."

objects:
  PRG:
    label: "Programme"
    description: "Opération immobilière globale servant de racine de contexte et pouvant porter des attributs généraux."
    allowed_parents: []
    root: true
    physical: false
    characteristics:
      denomination_programme:
        description: "Dénomination générale du programme."

  FON:
    label: "Foncier"
    description: "Périmètre foncier patrimonial dépendant d'un programme."
    allowed_parents: [PRG]
    physical: true

  PAR:
    label: "Parcelle"
    description: "Parcelle cadastrale composant tout ou partie du foncier."
    allowed_parents: [FON]

  RES:
    label: "Résidence"
    description: "Ensemble immobilier géré comme une même opération patrimoniale."
    allowed_parents: [FON]

  BAT:
    label: "Bâtiment"
    description: "Construction physiquement identifiable : immeuble, maison, bâtiment technique, bâtiment de stationnement, etc."
    allowed_parents: [RES]
    characteristics:
      type_batiment:
        examples:
          - "Immeuble collectif"
          - "Maison individuelle"
          - "Maison groupée / mitoyenne"
          - "Bâtiment technique"
          - "Bâtiment de stationnement"
          - "Autre"

  HAL:
    label: "Entrée / Hall"
    description: "Espace d'accès principal ou secondaire au bâtiment."
    allowed_parents: [BAT]

  CAG:
    label: "Cage d'escalier"
    description: "Ensemble physique organisant principalement une circulation verticale."
    allowed_parents: [BAT]

  CIR:
    label: "Zone de circulation"
    description: "Espace intérieur de distribution horizontale ou locale."
    allowed_parents: [BAT, CAG]

  LOG:
    label: "Logement"
    description: "Unité physique destinée à l'habitation."
    allowed_parents: [BAT, HAL, CAG, CIR]

  PIE:
    label: "Pièce"
    description: "Espace constitutif d'un logement ou d'un local d'activité / commerce."
    allowed_parents: [LOG, LOC]

  LOC:
    label: "Local d'activité / commerce"
    description: "Unité physique dédiée à une activité non résidentielle."
    allowed_parents: [BAT, HAL, CAG, CIR]

  EXP:
    label: "Espace extérieur privatif"
    description: "Jardin, terrasse, cour ou autre espace extérieur physiquement dépendant d'un logement ou d'un local."
    allowed_parents: [LOG, LOC]
    characteristics:
      type_espace_exterieur:
        examples:
          - "Jardin"
          - "Terrasse"
          - "Cour privative"
          - "Patio"
          - "Autre"

  LPO:
    label: "Local poubelles"
    description: "Local ou espace fermé principalement dédié aux déchets."
    allowed_parents: [BAT, HAL, CAG, CIR]

  LVE:
    label: "Local vélos"
    description: "Local principalement dédié au stationnement des vélos."
    allowed_parents: [BAT, HAL, CAG, CIR]

  CAV:
    label: "Cave"
    description: "Volume individualisé ou identifiable destiné au stockage."
    allowed_parents: [BAT, HAL, CAG, CIR]

  DEP:
    label: "Dépendance"
    description: "Annexe physique ne relevant pas d'une catégorie plus précise du référentiel."
    allowed_parents: [BAT, HAL, CAG, CIR]

  LTE:
    label: "Local technique"
    description: "Local accueillant principalement des équipements ou installations techniques."
    allowed_parents: [BAT, HAL, CAG, CIR, ZSI]
    characteristics:
      type_local_technique:
        examples:
          - "Chaufferie"
          - "Sous-station de chauffage"
          - "Local électrique / TGBT"
          - "Local gaz"
          - "Local eau"
          - "Local VMC / ventilation"
          - "Local SSI"
          - "Local télécom / courants faibles"
          - "Machinerie ascenseur"
          - "Local pompes / relevage"
          - "Local maintenance"
          - "Autre local technique"

  ZSI:
    label: "Zone de stationnement intérieure"
    description: "Zone intérieure organisée pour accueillir une ou plusieurs places de stationnement."
    allowed_parents: [BAT]

  EXT:
    label: "Espace extérieur de résidence"
    description: "Ensemble des espaces extérieurs collectifs ou généraux de la résidence."
    allowed_parents: [RES]

  VEG:
    label: "Espace végétalisé"
    description: "Surface végétalisée collective ou générale."
    allowed_parents: [EXT]

  CEX:
    label: "Zone de circulation extérieure"
    description: "Voirie, cheminement, accès ou circulation extérieure."
    allowed_parents: [EXT]

  AJE:
    label: "Aire de jeux"
    description: "Espace extérieur aménagé destiné aux jeux."
    allowed_parents: [EXT]

  ZSE:
    label: "Zone de stationnement extérieure"
    description: "Zone extérieure organisée pour accueillir des places de stationnement."
    allowed_parents: [EXT]

  PST:
    label: "Place de stationnement"
    description: "Emplacement individuel de stationnement."
    allowed_parents: [ZSI, ZSE]
    characteristics:
      configuration:
        examples: ["Ouverte", "Box fermé"]
      couverture:
        examples: ["Couverte", "Non couverte"]
      usage:
        examples: ["Standard", "PMR", "Moto", "Autre"]
      electrification:
        examples: ["Oui", "Non"]
      borne_recharge:
        examples: ["Oui", "Non"]

complementary_relations:
  IMPLANTE_SUR:
    source_types: [RES]
    target_types: [PAR]
    description: "Relation d'implantation cadastrale d'une résidence sur une ou plusieurs parcelles."

  AFFECTE_A:
    source_types: [PST]
    target_types: [LOG, LOC]
    description: "Affectation fonctionnelle d'une place de stationnement."

  UTILISE_PAR:
    source_types: [LVE, LPO, LTE, DEP]
    target_types: [BAT, LOG, LOC, RES]
    description: "Relation d'usage lorsque l'objet physique sert plusieurs entités."

  DESSERT:
    source_types: [LTE]
    target_types: [BAT, RES]
    description: "Relation de desserte technique."

forbidden_object_types:
  - LOT
  - PCM
  - "PARTIE COMMUNE"
  - MAISON
  - IMMEUBLE
  - BOX
  - CHAUFFERIE
  - ETAGE
  - RDC
  - R+1
  - R+2
  - PARKING
  - STATIONNEMENT

confidence_levels:
  - "Confirmé"
  - "Probable"
  - "À vérifier"

source_traceability:
  required_when_available:
    - document_source
    - page_or_plan
    - source_reference
    - observed_element
    - identification_mode
    - confidence
  identification_modes:
    - "Explicite"
    - "Déduit"
