version: "1.4.0"
project: "ARIANE"
purpose: "Protocole standardisé de captation patrimoniale cumulative assistée par IA."

execution_modes:
  INITIALISATION_PROGRAMME:
    description: >-
      Premier traitement documentaire d'un programme. L'IA construit une structure patrimoniale proposée
      et capte les premières observations attributaires.
    may_create_structure: true
    may_modify_validated_structure: false
    outputs: [SOURCES, STRUCTURE_PROPOSEE, OBSERVATIONS, RELATIONS, ANOMALIES]

  CAPTATION_INCREMENTALE:
    description: >-
      Traitement de tout jeu documentaire postérieur. La structure patrimoniale validée du programme
      est fournie en entrée et ne peut jamais être modifiée par l'IA. Un objet absent peut toutefois
      être conservé comme OBJET_CANDIDAT dans la CAPTURE avec ses observations et relations associées.
    may_create_structure: false
    may_emit_candidate_objects: true
    may_modify_validated_structure: false
    outputs: [SOURCES, OBJETS_CANDIDATS, OBSERVATIONS, RELATIONS, ANOMALIES]

required_context:
  always:
    - programme_id
    - capture_id
    - documents
  incremental_only:
    - validated_structure
    - structure_version

normative_resources:
  objects: "ia/referentiel/objets-patrimoniaux.yaml"
  legal_relations: "ia/referentiel/relations-juridiques.yaml"
  attributes_index: "ia/referentiel/attributs/index.yaml"
  execution: "ia/instructions/EXECUTION.md"
  rules:
    - "ia/regles/01-structure-patrimoniale.md"
    - "ia/regles/02-captation-attributs.md"
    - "ia/regles/03-captation-incrementale.md"
    - "ia/regles/04-tracabilite-et-sources.md"
    - "ia/regles/05-score-confiance.md"
    - "ia/regles/06-preservation-observations.md"
    - "ia/regles/07-finalisation-structure-validee.md"
    - "ia/regles/08-capture-current.md"

principles:
  - "Une CAPTURE est immuable après émission et conserve les constats de l'itération, y compris les objets candidats et leurs données."
  - "CURRENT représente l'état consolidé courant du programme ; il n'est jamais l'historique exhaustif des sorties IA."
  - "Une structure validée est intangible pendant les captations incrémentales."
  - "Un objet absent de la structure validée peut être émis comme CANDIDAT_STRUCTURE dans la CAPTURE, mais ne peut pas entrer dans la structure validée ni dans CURRENT sans décision humaine explicite."
  - "Les observations et relations d'un objet candidat sont conservées dans la CAPTURE avec le statut EN_ATTENTE_RATTACHEMENT_STRUCTUREL."
  - "L'action VALIDER_STRUCTURE est le seul mécanisme IA autorisé pour matérialiser une décision humaine d'évolution de structure et promouvoir les données devenues rattachables vers CURRENT."
  - "L'IA ne décide jamais seule qu'une structure est validée."
  - "Une observation ne remplace jamais une observation antérieure."
  - "La validation humaine des observations est hors du périmètre IA."
  - "Toute source analysée est déclarée dans la sortie SOURCES avec un source_id stable pour la captation."
  - "Toute observation est rattachée à un programme, une captation, une source, un objet existant ou candidat, et un attribut."
  - "Toute captation conserve la preuve documentaire et un score de confiance de l'IA."
  - "repere_source est réservé à une désignation explicitement portée par la source et rattachée sans ambiguïté à l'objet ; il ne peut jamais être fabriqué par l'IA ni utilisé pour une simple caractéristique descriptive."
  - "source_anchor localise la preuve documentaire ; il ne doit jamais être recopié automatiquement dans repere_source."
  - "Lorsqu'une zone de circulation intérieure physique (CIR), y compris un simple palier, dessert directement un logement ou un local, cette CIR est obligatoirement son parent principal."
  - "Les niveaux RDC, R+1, R+2, SS-1, etc. sont des localisations et ne justifient jamais à eux seuls la création d'une CIR ; sans circulation physique intermédiaire démontrable, le rattachement direct au BAT reste autorisé."

structure_validation:
  autonomous_ai_validation: false
  ai_execution_allowed_only_on_explicit_current_user_instruction: true
  canonical_action: "VALIDER_STRUCTURE"
  required_user_supplied_fields:
    - action
    - human_approval
    - programme_id
    - target_structure_version
  candidate_promotion_field: "approved_candidate_object_ids"
  request_schema: "ia/schemas/structure-finalization-request.schema.json"
  rule: "ia/regles/07-finalisation-structure-validee.md"
  missing_field_behavior: "DO_NOT_VALIDATE"

capture_current:
  capture_immutable: true
  candidate_data_status: "EN_ATTENTE_RATTACHEMENT_STRUCTUREL"
  promote_candidate_data_only_on_structure_validation: true
  current_structure_must_be_validated: true
