project: ARIANE
package_version: "1.3.0"
ai_scope_root: "ia"
entrypoint: "instructions/EXECUTION.md"

execution_modes:
  - INITIALISATION_PROGRAMME
  - CAPTATION_INCREMENTALE

referential:
  objects: "referentiel/objets-patrimoniaux.yaml"
  legal_relations: "referentiel/relations-juridiques.yaml"
  attributes_index: "referentiel/attributs/index.yaml"

rules:
  - "regles/01-structure-patrimoniale.md"
  - "regles/02-captation-attributs.md"
  - "regles/03-captation-incrementale.md"
  - "regles/04-tracabilite-et-sources.md"
  - "regles/05-score-confiance.md"
  - "regles/06-preservation-observations.md"

schemas:
  capture_request: "schemas/capture-request.schema.json"
  structure: "schemas/structure.schema.json"
  object: "schemas/objet.schema.json"
  source: "schemas/source.schema.json"
  observation: "schemas/observation.schema.json"
  relation: "schemas/relation.schema.json"
  anomaly: "schemas/anomalie.schema.json"

invariants:
  - "PROGRAMME est la clé de continuité entre toutes les captations d'une même opération."
  - "Après validation externe de la structure initiale, CAPTATION_INCREMENTALE traite la structure comme strictement immuable."
  - "Les observations sont additives et ne sont jamais écrasées par une nouvelle captation."
  - "L'IA ne décide jamais quelle observation fait foi."
  - "La validation humaine est hors du périmètre IA et n'est pas représentée dans les sorties de captation."
  - "Une information impossible à rattacher à la structure validée produit une anomalie et non une modification structurelle."
